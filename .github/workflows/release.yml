name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach release assets to'
        required: true
        default: v1.0.0

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential file pkg-config \
            patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build and publish release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Markdown Viewer ${{ env.TAG }}
          # Hyphenated, space-free asset names.
          assetNamePattern: Markdown-Viewer_[version]_[platform]_[arch][setup][ext]
          releaseBody: See CHANGELOG.md for the changes in this release.
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: Package portable executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.tauri.outputs.appVersion }}"
          $name = "Markdown-Viewer_${version}_windows_x64_portable.zip"
          Compress-Archive -Path src-tauri/target/release/markdown-viewer.exe, LICENSE -DestinationPath $name
          "PORTABLE_ZIP=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload portable executable artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: portable-windows
          path: ${{ env.PORTABLE_ZIP }}

      - name: Attach portable executable to the release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Derive the tag from the release this build published, so the upload
          # always targets that same release.
          $tag = ("${{ steps.tauri.outputs.releaseHtmlUrl }}" -split '/')[-1]
          gh release upload "$tag" "$env:PORTABLE_ZIP" --clobber

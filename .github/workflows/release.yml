name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach release assets to'
        required: true
        default: v1.0.0

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential file pkg-config \
            patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The release body becomes `notes` in latest.json, which the in-app
      # updater shows as "what's new", so it carries this version's CHANGELOG
      # section rather than a pointer to the file.
      - name: Collect the release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            node scripts/release-notes.mjs "${{ env.TAG }}"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # `bundle.createUpdaterArtifacts` is on, so the bundler signs every update
      # artifact and refuses to build without the private key. Checking first
      # turns a confusing bundler failure near the end of the build into a clear
      # message: add the two repository secrets, or turn the option off.
      - name: Verify the updater signing secrets
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Missing repository secret TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD). They sign the updater artifacts and latest.json required by the in-app updater."
            exit 1
          fi

      - name: Build and publish release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts and lets the action attach `latest.json`,
          # which `plugins > updater > endpoints` points at.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Both platform builds upload into the same release; the action merges
          # their entries into one `latest.json`.
          includeUpdaterJson: true
          tagName: ${{ env.TAG }}
          releaseName: Markdown Viewer ${{ env.TAG }}
          # Hyphenated, space-free asset names.
          assetNamePattern: Markdown-Viewer_[version]_[platform]_[arch][setup][ext]
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: Package portable executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.tauri.outputs.appVersion }}"
          $name = "Markdown-Viewer_${version}_windows_x64_portable.zip"
          Compress-Archive -Path src-tauri/target/release/markdown-viewer.exe, LICENSE -DestinationPath $name
          "PORTABLE_ZIP=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload portable executable artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: portable-windows
          path: ${{ env.PORTABLE_ZIP }}

      - name: Attach portable executable to the release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Derive the tag from the release this build published, so the upload
          # always targets that same release.
          $tag = ("${{ steps.tauri.outputs.releaseHtmlUrl }}" -split '/')[-1]
          gh release upload "$tag" "$env:PORTABLE_ZIP" --clobber

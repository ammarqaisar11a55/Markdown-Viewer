<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" font-family="Inter, system-ui, sans-serif">
  <title>Rendering pipeline: Markdown file, Rust renderer, sanitizer, viewer</title>
  <rect width="720" height="220" rx="12" fill="#f6f8fb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <g stroke="#cbd2dc" stroke-width="1.5">
    <rect x="30" y="70" width="140" height="80" rx="10" fill="#ffffff"/>
    <rect x="210" y="70" width="140" height="80" rx="10" fill="#ffffff"/>
    <rect x="390" y="70" width="140" height="80" rx="10" fill="#ffffff"/>
    <rect x="570" y="70" width="120" height="80" rx="10" fill="#e8f0fd" stroke="#2f6fde"/>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="170" y1="110" x2="206" y2="110"/>
    <line x1="350" y1="110" x2="386" y2="110"/>
    <line x1="530" y1="110" x2="566" y2="110"/>
  </g>
  <g text-anchor="middle" fill="#1f2937">
    <text x="100" y="106" font-size="15" font-weight="600">README.md</text>
    <text x="100" y="128" font-size="12" fill="#6b7280">untrusted input</text>
    <text x="280" y="106" font-size="15" font-weight="600">comrak</text>
    <text x="280" y="128" font-size="12" fill="#6b7280">GFM → HTML</text>
    <text x="460" y="106" font-size="15" font-weight="600">ammonia</text>
    <text x="460" y="128" font-size="12" fill="#6b7280">allow-list sanitizer</text>
    <text x="630" y="106" font-size="15" font-weight="600" fill="#2f6fde">Viewer</text>
    <text x="630" y="128" font-size="12" fill="#6b7280">React + CSP</text>
  </g>
  <text x="360" y="40" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Markdown Viewer rendering pipeline</text>
  <text x="280" y="185" text-anchor="middle" font-size="11" fill="#6b7280">Rust, off the UI thread</text>
  <line x1="200" y1="170" x2="540" y2="170" stroke="#cbd2dc" stroke-dasharray="4 4"/>
</svg>

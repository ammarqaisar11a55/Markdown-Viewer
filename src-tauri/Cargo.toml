[package]
name = "markdown-viewer"
version = "1.0.0"
description = "A fast, secure, offline Markdown reader"
authors = ["Muhammad Ammar Qaisar"]
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "markdown_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mdv-core = { path = "crates/mdv-core" }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
log = "0.4"
notify-debouncer-full = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = [".", "crates/mdv-core"]

# Optimize dependencies (comrak, ammonia, html5ever…) in debug and test builds:
# large-document tests and `tauri dev` stay fast while our own code keeps
# quick incremental builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

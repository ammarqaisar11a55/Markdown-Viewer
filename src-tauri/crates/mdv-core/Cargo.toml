[package]
name = "mdv-core"
version = "1.0.0"
description = "Platform-independent core of Markdown Viewer: rendering, sanitization and filesystem access."
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[dependencies]
ammonia = "4"
comrak = { version = "0.55", default-features = false }
dunce = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
